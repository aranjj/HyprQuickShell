[templates.gtk4]
input_path = "/home/aran/.config/matugen/templates/gtk-colors.css"
output_path = "/home/aran/.config/gtk-4.0/colors.css"

# 4. KDE Plasma & Qt 5/6 Color Scheme
[templates.kde]
input_path = "/home/aran/.config/matugen/templates/Matugen.colors"
