[config]

# 1. Canonical Source of Truth
[templates.theme_toml]
input_path = "/home/aran/.config/matugen/templates/colors.toml"
output_path = "/home/aran/.config/theme/colors.toml"

# 2. Quickshell Native JSON
[templates.quickshell_json]
input_path = "/home/aran/.config/matugen/templates/colors.json"
output_path = "/home/aran/.config/quickshell/theme/colors.json"

# 3. GTK 3 & 4 Theme Palettes
[templates.gtk3]
input_path = "/home/aran/.config/matugen/templates/gtk-colors.css"
