# 5. Kitty Terminal
[templates.kitty]
input_path = "/home/aran/.config/matugen/templates/kitty.conf"
output_path = "/home/aran/.config/kitty/colors-matugen.conf"

# 6. Hyprland Borders & Tokens
[templates.hyprland]
